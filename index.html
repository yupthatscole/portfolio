    <audio id="song" src="song.mp3" loop autoplay></audio>
</main>

<script>
    const song = document.getElementById("song");
    song.volume = 0.4;

    const events = ["pointerdown", "keydown", "touchend"];

    function stopListening() {
        events.forEach(e => document.removeEventListener(e, startSong));
    }

    function startSong() {
        song.play()
            .then(stopListening)
            .catch(err => console.log("song blocked until interaction:", err.name));
    }

    song.addEventListener("error", () => {
        console.log("song.mp3 failed to load — check the file name/path");
    });

    events.forEach(e => document.addEventListener(e, startSong));
    startSong();
</script>
</body>
